<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<!-- avoid flash of wrong theme -->
<script>
  (function () {
    var saved = localStorage.getItem("jr-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<script data-goatcounter="https://jwrampino.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="wordmark">JR</a>

  {% include nav-tabs.html %}
  {% include nav-dir.html %}

  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch between light and dark mode">
    <span class="toggle-track">
      <svg class="toggle-glyph glyph-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
      </svg>
      <svg class="toggle-glyph glyph-term" viewBox="0 0 24 24" fill="none">
        <path d="M5 7L11 12L5 17" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="13" y1="18" x2="19" y2="18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="toggle-thumb"></span>
    </span>
  </button>
</header>

<div class="page-shell">
  <div class="page-content">
    <main id="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>jacob rampino. hosted by github.</p>
    </footer>
  </div>

  {% if page.photo_light %}
  <aside class="page-photo">
    <img class="hero-photo-light" src="{{ page.photo_light | relative_url }}" alt="">
    {% if page.photo_dark %}<img class="hero-photo-dark" src="{{ page.photo_dark | relative_url }}" alt="">{% endif %}
  </aside>
  {% endif %}
</div>

<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
