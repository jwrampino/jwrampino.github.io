<nav class="nav nav-dir" aria-label="Primary">
  <p class="dir-prompt">~/jrampino $ ls</p>
  <ul class="dir-list">
  {% for item in site.data.nav %}
    {% assign is_active = false %}
    {% if page.navkey == item.key %}{% assign is_active = true %}{% endif %}
    <li>
      <a href="{{ item.url | relative_url }}"
         class="dir-entry{% if is_active %} is-active{% endif %}"
         {% if is_active %}aria-current="page"{% endif %}>
        <span class="dir-index">{{ forloop.index | prepend: "0" | slice: -2, 2 }}</span><span class="dir-name">{{ item.key }}</span><span class="dir-ext">.md</span>{% if is_active %}<span class="dir-cursor"> ←</span>{% endif %}
      </a>
    </li>
  {% endfor %}
  </ul>
</nav>
