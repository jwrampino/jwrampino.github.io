{% assign entry = include.entry %}
{% assign meta = include.meta | default: entry.date %}
<a class="clip-card" href="{{ entry.url | default: '#' }}"{% if entry.url and entry.url != "" %} target="_blank" rel="noopener"{% endif %}>
  <div class="clip-thumb">
    {% if entry.image and entry.image != "" %}
    <img src="{{ entry.image | relative_url }}" alt="">
    {% endif %}
  </div>
  <div class="clip-body">
    <p class="clip-title">{{ entry.title }}</p>
    <p class="clip-date">{{ meta }}</p>
    <p class="clip-desc">{{ entry.description }}</p>
  </div>
</a>
